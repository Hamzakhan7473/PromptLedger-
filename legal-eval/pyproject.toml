[project]
name = "legal-eval"
version = "0.1.0"
description = "Frontier-grade LLM evaluation for legal contract understanding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "httpx",
    "matplotlib",
    "pyyaml",
    "scikit-learn",
    "numpy",
    "pandas",
    "tenacity",
    "boto3",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
