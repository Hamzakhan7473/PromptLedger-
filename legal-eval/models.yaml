# Pin exact model version strings before running evals.
# Replace every TODO_* placeholder with the model ID your provider expects.

defaults:
  max_tokens: 4096
  temperature: 0.0

models:
  anthropic:
    provider: anthropic
    model_id: "TODO_ANTHROPIC_MODEL"
    env_key: ANTHROPIC_API_KEY

  openai:
    provider: openai
    model_id: "TODO_OPENAI_MODEL"
    env_key: OPENAI_API_KEY

  google:
    provider: google
    model_id: "TODO_GOOGLE_MODEL"
    env_key: GOOGLE_API_KEY

  open:
    provider: openai_compatible
    model_id: "TODO_OPEN_MODEL"
    base_url: "TODO_OPENAI_COMPATIBLE_BASE_URL"
    env_key: OPENAI_COMPATIBLE_API_KEY

  bedrock_claude:
    provider: bedrock
    provider_path: bedrock
    model_id: "TODO_BEDROCK_CLAUDE_MODEL"
    region: "TODO_AWS_REGION"
    # Auth: standard AWS credential chain (env vars, ~/.aws, IAM role).

# Judge model — pin a strong frontier model before running adjudication or validation.
judge:
  provider: anthropic
  model_id: "TODO_JUDGE_MODEL"
  env_key: ANTHROPIC_API_KEY
