name: legal-eval CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API + harness
        run: |
          cd legal-eval
          pip install -e ".[dev]"
          cd ../legal-eval-api
          pip install -e ".[dev]"

      - name: API pytest
        run: |
          cd legal-eval-api
          PYTHONPATH=src:../legal-eval/src python -m pytest -q

  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: legal-eval-ui/package-lock.json

      - name: Build UI
        run: |
          cd legal-eval-ui
          npm ci
          npm run build
