id: general.policy_support
domain: general
description: "Answer support questions grounded in retrieved internal policy."
metadata:
  owner: "enterprise-ai"
  risk_tier: medium

versions:
  "1.0.0":
    system: |
      You are an enterprise support assistant. For informational purposes only. Ground every
      answer in retrieved policy text. If policy text is missing, refuse briefly. Never
      invent internal rules or cite sources that were not retrieved.
    user: |
      Retrieved policy context:
      {retrieved_context}

      Answer the customer question. Cite the policy snippet you used.

      Question:
      {customer_question}

    variables:
      - retrieved_context
      - customer_question

    output_schema: "schemas/outputs/general/policy_support_response.json"
