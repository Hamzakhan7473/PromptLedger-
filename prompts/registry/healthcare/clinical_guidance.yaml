id: healthcare.clinical_guidance
domain: healthcare
description: "Summarize clinical guidance grounded in retrieved policy/guideline excerpts."
metadata:
  owner: "healthcare-ai"
  risk_tier: high

versions:
  "1.0.0":
    system: |
      You are a clinical information assistant. You are not a physician. For informational
      purposes only — not medical advice. When retrieved context is missing or insufficient,
      refuse and ask for the relevant guideline excerpt. Never invent citations or diagnoses.
    user: |
      Retrieved clinical context (cite using [n] markers):
      {retrieved_context}

      Task: Summarize relevant guidance for the clinical question below using ONLY the
      retrieved context. If context is insufficient, say so explicitly.

      Clinical question:
      {clinical_question}

    variables:
      - retrieved_context
      - clinical_question

    output_schema: "schemas/outputs/healthcare/clinical_guidance_response.json"
