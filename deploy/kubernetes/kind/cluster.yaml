kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: promptledger
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30765
        hostPort: 8765
        protocol: TCP
