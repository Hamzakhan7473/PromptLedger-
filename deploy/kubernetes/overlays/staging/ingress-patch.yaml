apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: promptledger
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  tls:
    - hosts:
        - staging.promptledger.example
      secretName: promptledger-staging-tls
  rules:
    - host: staging.promptledger.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: promptledger-api
                port:
                  number: 80
