apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - pairs:
      environment: dev
    includeSelectors: true

replicas:
  - name: promptledger-api
    count: 1

patches:
  - path: deployment-patch.yaml
  - path: service-nodeport.yaml
  - path: delete-hpa.yaml
  - path: delete-networkpolicy.yaml

images:
  - name: promptledger/demo
    newName: promptledger/demo
    newTag: dev
