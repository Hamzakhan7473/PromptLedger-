apiVersion: apps/v1
kind: Deployment
metadata:
  name: promptledger-api
spec:
  template:
    metadata:
      annotations:
        environment: production
    spec:
      containers:
        - name: api
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
