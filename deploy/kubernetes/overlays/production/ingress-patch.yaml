apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: promptledger
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "120"
spec:
  tls:
    - hosts:
        - demo.promptledger.example
      secretName: promptledger-prod-tls
  rules:
    - host: demo.promptledger.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: promptledger-api
                port:
                  number: 80
