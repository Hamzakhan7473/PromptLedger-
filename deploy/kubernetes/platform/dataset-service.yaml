apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataset-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataset-service
  template:
    metadata:
      labels:
        app: dataset-service
    spec:
      containers:
        - name: dataset-service
          image: promptledger/platform:latest
          env:
            - { name: SERVICE, value: dataset-service }
            - { name: PORT, value: "8086" }
            - { name: PROMPT_LEDGER_ROOT, value: /app }
          volumeMounts:
            - name: data
              mountPath: /app/.data
          ports:
            - { containerPort: 8086, name: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dataset-service
spec:
  selector:
    app: dataset-service
  ports:
    - port: 8086
      targetPort: http
