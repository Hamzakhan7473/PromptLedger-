apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-services
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: platform.promptledger.local
      http:
        paths:
          - path: /api/v1/agent
            pathType: Prefix
            backend:
              service:
                name: agent-service
                port:
                  number: 8081
          - path: /api/v1/env
            pathType: Prefix
            backend:
              service:
                name: environment-service
                port:
                  number: 8082
          - path: /api/v1/reward
            pathType: Prefix
            backend:
              service:
                name: reward-service
                port:
                  number: 8083
          - path: /api/v1/trace
            pathType: Prefix
            backend:
              service:
                name: trace-service
                port:
                  number: 8084
          - path: /api/v1/eval
            pathType: Prefix
            backend:
              service:
                name: eval-service
                port:
                  number: 8085
          - path: /api/v1/datasets
            pathType: Prefix
            backend:
              service:
                name: dataset-service
                port:
                  number: 8086
