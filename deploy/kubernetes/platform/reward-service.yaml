apiVersion: apps/v1
kind: Deployment
metadata:
  name: reward-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reward-service
  template:
    metadata:
      labels:
        app: reward-service
    spec:
      containers:
        - name: reward-service
          image: promptledger/platform:latest
          env:
            - { name: SERVICE, value: reward-service }
            - { name: PORT, value: "8083" }
            - { name: PROMPT_LEDGER_ROOT, value: /app }
          ports:
            - { containerPort: 8083, name: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: reward-service
spec:
  selector:
    app: reward-service
  ports:
    - port: 8083
      targetPort: http
