apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eval-service
  template:
    metadata:
      labels:
        app: eval-service
    spec:
      containers:
        - name: eval-service
          image: promptledger/platform:latest
          env:
            - { name: SERVICE, value: eval-service }
            - { name: PORT, value: "8085" }
            - { name: PROMPT_LEDGER_ROOT, value: /app }
          ports:
            - { containerPort: 8085, name: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: eval-service
spec:
  selector:
    app: eval-service
  ports:
    - port: 8085
      targetPort: http
