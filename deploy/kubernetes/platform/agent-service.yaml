apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  labels:
    app: agent-service
    app.kubernetes.io/component: agent-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: agent-service
          image: promptledger/platform:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE
              value: agent-service
            - name: PORT
              value: "8081"
            - name: PROMPT_LEDGER_ROOT
              value: /app
          envFrom:
            - configMapRef:
                name: platform-services-config
          ports:
            - containerPort: 8081
              name: http
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  labels:
    app: agent-service
spec:
  selector:
    app: agent-service
  ports:
    - port: 8081
      targetPort: http
      name: http
