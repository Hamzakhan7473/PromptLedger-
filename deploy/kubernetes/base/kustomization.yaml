apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: promptledger

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: promptledger
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true

images:
  - name: promptledger/demo
    newName: promptledger/demo
    newTag: latest
