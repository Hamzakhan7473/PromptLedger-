apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: promptledger-api
  labels:
    app.kubernetes.io/name: promptledger
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: promptledger
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8765
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8765
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
