apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: promptledger
  labels:
    app.kubernetes.io/name: promptledger
    app.kubernetes.io/component: api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: promptledger.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: promptledger-api
                port:
                  number: 80
