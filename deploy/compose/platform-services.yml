# Local microservices stack (agent, environment, reward, trace, eval, dataset).
services:
  agent-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.platform
    environment:
      SERVICE: agent-service
      PORT: 8081
      PROMPT_LEDGER_ROOT: /app
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 15s
      timeout: 3s
      retries: 3

  environment-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.platform
    environment:
      SERVICE: environment-service
      PORT: 8082
    ports: ["8082:8082"]

  reward-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.platform
    environment:
      SERVICE: reward-service
      PORT: 8083
    ports: ["8083:8083"]

  trace-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.platform
    environment:
      SERVICE: trace-service
      PORT: 8084
    ports: ["8084:8084"]
    volumes:
      - platform-data:/app/.data

  eval-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.platform
    environment:
      SERVICE: eval-service
      PORT: 8085
    ports: ["8085:8085"]

  dataset-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.platform
    environment:
      SERVICE: dataset-service
      PORT: 8086
    ports: ["8086:8086"]
    volumes:
      - platform-data:/app/.data

volumes:
  platform-data:
