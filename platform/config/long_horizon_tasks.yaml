# Long-horizon workflows (20–50 steps) — Halluminate-style task graphs.
version: 1

tasks:
  sec_financial_model:
    label: SEC filing → Excel → EBITDA memo → deck
    environment: financial_modeling
    horizon_steps: 35
    steps:
      - id: retrieve_sec_filing
        tool: document_search
        agent: retrieval_agent
      - id: extract_revenue
        tool: code_interpreter
        agent: retrieval_agent
      - id: build_excel_model
        tool: excel_generator
        agent: excel_agent
      - id: compute_ebitda
        tool: calculator
        agent: excel_agent
      - id: generate_memo
        tool: rag_retriever
        agent: tax_agent
      - id: create_powerpoint
        tool: powerpoint_generator
        agent: ppt_agent
      - id: verify_citations
        tool: citation_engine
        agent: citation_agent
      - id: final_report
        tool: document_search
        agent: verification_agent

  tax_research_pack:
    label: Tax research with citation verification
    environment: tax
    horizon_steps: 25
    steps:
      - { id: policy_retrieval, tool: rag_retriever, agent: retrieval_agent }
      - { id: tax_analysis, tool: calculator, agent: tax_agent }
      - { id: legal_cross_check, tool: document_search, agent: legal_agent }
      - { id: cite_verify, tool: citation_engine, agent: citation_agent }

computer_use:
  drivers: [playwright, browserbase, openai_computer_use, claude_computer_use]
  environments:
    - quickbooks
    - excel
    - sap
    - netsuite
    - salesforce
