# Default reward-service formula (Halluminate-style weighting).
version: 1

formula: |
  reward =
    0.4 * correctness +
    0.2 * citations +
    0.15 * latency +
    0.15 * cost +
    0.1 * compliance

weights:
  correctness: 0.4
  citations: 0.2
  latency: 0.15
  cost: 0.15
  compliance: 0.1

# Maps to RewardBreakdown fields
field_map:
  citations: citation_quality
  compliance: policy_compliance
