# RL environment layer — maps to PromptLedger packs and demo verticals.
version: 1

environments:
  tax:
    label: Tax Environment
    description: Tax research, filing guidance, and policy Q&A with citation requirements.
    prompt_id: finance.transaction_classification
    pack_dir: packs/finance-assistant
    demo_vertical: fintech
    tools: [rag_retriever, document_search, citation_engine, calculator]
    reward_weights:
      correctness: 0.35
      citation_quality: 0.25
      policy_compliance: 0.25
      cost: 0.05
      latency: 0.05
      human_feedback: 0.05

  legal:
    label: Legal Environment
    description: Case law and policy-grounded legal assistance with refusal on missing context.
    prompt_id: legal.contract_review
    pack_dir: packs/legal-assistant
    demo_vertical: legal
    tools: [rag_retriever, document_search, citation_engine, browser_agent]
    reward_weights:
      correctness: 0.3
      citation_quality: 0.3
      policy_compliance: 0.3
      cost: 0.05
      latency: 0.05

  financial_modeling:
    label: Financial Modeling Environment
    description: Spreadsheets, scenarios, and quantitative analysis with audit trail.
    prompt_id: finance.transaction_classification
    pack_dir: packs/finance-assistant
    demo_vertical: fintech
    tools: [rag_retriever, excel_generator, calculator, citation_engine]
    reward_weights:
      correctness: 0.4
      citation_quality: 0.2
      policy_compliance: 0.2
      cost: 0.1
      latency: 0.1

  contract_review:
    label: Contract Review Environment
    description: Clause extraction, risk flags, and structured JSON review output.
    prompt_id: legal.contract_review
    pack_dir: packs/legal-assistant
    demo_vertical: legal
    tools: [rag_retriever, document_search, citation_engine, code_interpreter]
    reward_weights:
      correctness: 0.35
      citation_quality: 0.25
      policy_compliance: 0.3
      cost: 0.05
      latency: 0.05

  research:
    label: Research Environment
    description: Multi-source synthesis with traceability for enterprise knowledge work.
    prompt_id: general.policy_support
    pack_dir: packs/general-assistant
    demo_vertical: general
    tools: [rag_retriever, document_search, browser_agent, citation_engine, code_interpreter]
    reward_weights:
      correctness: 0.3
      citation_quality: 0.25
      policy_compliance: 0.15
      cost: 0.1
      latency: 0.1
      human_feedback: 0.1
